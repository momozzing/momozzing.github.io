<!-- Pretendard 웹폰트 (dynamic subset: 쓰는 글자만 내려받아 가벼움) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous">

<!-- 다크/라이트 테마: 저장된 선택을 페인트 전에 적용해 깜빡임(FOUC) 방지 -->
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;

    var mql = window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') ||
        (mql.matches ? 'dark' : 'light');
    }

    function renderIcon() {
      btn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
    }

    btn.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      renderIcon();

      // utterances 댓글창 테마도 함께 전환
      var utterances = document.querySelector('iframe.utterances-frame');
      if (utterances) {
        utterances.contentWindow.postMessage(
          { type: 'set-theme', theme: next === 'dark' ? 'github-dark' : 'github-light' },
          'https://utteranc.es'
        );
      }
    });

    renderIcon();
  });

  // 코드블록 복사 버튼
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('div.highlighter-rouge, figure.highlight').forEach(function (block) {
      var code = block.querySelector('pre');
      if (!code) return;

      var btn = document.createElement('button');
      btn.className = 'code-copy-btn';
      btn.type = 'button';
      btn.textContent = '복사';
      btn.setAttribute('aria-label', '코드 복사');

      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(code.innerText).then(function () {
          btn.textContent = '복사됨!';
          setTimeout(function () { btn.textContent = '복사'; }, 1500);
        });
      });

      block.appendChild(btn);
    });
  });
</script>
