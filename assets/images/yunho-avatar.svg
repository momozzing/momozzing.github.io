<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- background -->
  <circle cx="200" cy="200" r="200" fill="#F3E7D8"/>
  <circle cx="200" cy="200" r="200" fill="none"/>
  <!-- decorative cafe dots -->
  <circle cx="70" cy="90" r="14" fill="#E8D5BC"/>
  <circle cx="330" cy="110" r="18" fill="#E8D5BC"/>
  <circle cx="320" cy="60" r="8" fill="#EADCC8"/>
  <circle cx="55" cy="150" r="7" fill="#EADCC8"/>

  <!-- body: black crewneck -->
  <path d="M 90 400 C 92 330 130 296 200 296 C 270 296 308 330 310 400 Z" fill="#26262B"/>
  <!-- collar rib -->
  <path d="M 156 302 C 170 322 230 322 244 302 C 232 314 168 314 156 302 Z" fill="#3A3A41"/>

  <!-- neck -->
  <rect x="178" y="264" width="44" height="46" rx="18" fill="#EFC49B"/>
  <path d="M 178 268 C 190 282 210 282 222 268 L 222 258 L 178 258 Z" fill="#E0AF85"/>

  <!-- ears -->
  <circle cx="118" cy="196" r="17" fill="#EFC49B"/>
  <circle cx="282" cy="196" r="17" fill="#EFC49B"/>
  <!-- earrings -->
  <circle cx="116" cy="208" r="4.5" fill="#1E1E22"/>
  <circle cx="284" cy="208" r="4.5" fill="#1E1E22"/>

  <!-- face -->
  <path d="M 124 170 C 124 236 156 274 200 274 C 244 274 276 236 276 170 C 276 120 244 96 200 96 C 156 96 124 120 124 170 Z" fill="#F4CCA3"/>

  <!-- mushroom bowl hair -->
  <path d="M 112 196
           C 104 108 148 66 200 66
           C 252 66 296 108 288 196
           C 287 203 280 204 278 197
           C 275 188 271 182 267 177
           C 248 190 152 190 133 177
           C 129 182 125 188 122 197
           C 120 204 113 203 112 196 Z" fill="#241C1E"/>
  <!-- hair fringe curve -->
  <path d="M 133 177 C 152 158 248 158 267 177 C 260 185 248 190 200 190 C 152 190 140 185 133 177 Z" fill="#241C1E"/>
  <!-- hair shine -->
  <path d="M 150 96 C 165 84 195 80 214 84 C 190 84 168 90 150 96 Z" fill="#3B3134"/>

  <!-- eyes: small, slightly downcast -->
  <path d="M 158 210 Q 168 204 178 210" fill="none" stroke="#2A2224" stroke-width="5" stroke-linecap="round"/>
  <path d="M 222 210 Q 232 204 242 210" fill="none" stroke="#2A2224" stroke-width="5" stroke-linecap="round"/>
  <circle cx="168" cy="213" r="4" fill="#2A2224"/>
  <circle cx="232" cy="213" r="4" fill="#2A2224"/>

  <!-- blush -->
  <ellipse cx="150" cy="228" rx="10" ry="6" fill="#F0AE84" opacity="0.55"/>
  <ellipse cx="250" cy="228" rx="10" ry="6" fill="#F0AE84" opacity="0.55"/>

  <!-- nose -->
  <path d="M 200 218 Q 197 228 201 232" fill="none" stroke="#DDA275" stroke-width="4" stroke-linecap="round"/>

  <!-- mouth: calm -->
  <path d="M 188 248 Q 200 254 212 248" fill="none" stroke="#C67B5B" stroke-width="5" stroke-linecap="round"/>

  <!-- hand holding pen -->
  <circle cx="272" cy="360" r="22" fill="#EFC49B"/>
  <path d="M 252 356 C 258 348 286 348 292 358" fill="none" stroke="#E0AF85" stroke-width="3" stroke-linecap="round"/>
  <!-- pen -->
  <g transform="rotate(-40 272 360)">
    <rect x="265" y="302" width="14" height="68" rx="6" fill="#C9CDD4"/>
    <rect x="265" y="354" width="14" height="16" rx="5" fill="#3A3A41"/>
    <path d="M 266 304 L 272 290 L 278 304 Z" fill="#9AA0A9"/>
  </g>
</svg>
